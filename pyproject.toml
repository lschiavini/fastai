[project]
name = "fasta-course"
version = "0.1.0"
description = "jupyter notebooks for fast ai course"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=9.8.0",
    "fastai>=2.8.5",
    "fastcore>=1.8.16",
    "fastdownload>=0.0.7",
    "gradio>=5.49.1",
    "notebook>=7.4.7",
    "scikit-image>=0.25.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
